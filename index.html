
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aditya Snake Pro</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:16px 8px;min-height:100vh;
 background:linear-gradient(135deg,#100525,#052c38,#102819);
 color:white;font-family:Arial,sans-serif;text-align:center
}
h1{color:#5dffb0;text-shadow:0 0 18px #00ffae}
.panel{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
 margin:12px auto;max-width:450px}
.stat{background:#ffffff15;border:1px solid #ffffff30;
 padding:9px;border-radius:10px;flex:1;min-width:75px}
canvas{width:min(94vw,420px);height:auto;
 border:3px solid #5dffb0;border-radius:14px;
 box-shadow:0 0 24px #36ffb255}
button,select{padding:11px;border:0;border-radius:9px;
 margin:4px;font-weight:bold;cursor:pointer}
button{background:linear-gradient(135deg,#5dffb0,#4abaff);
 color:#08152b}
.controls{max-width:450px;margin:10px auto}
#msg{color:#ffe77d;min-height:24px}
.dpad{display:grid;grid-template-columns:55px 55px 55px;
 grid-template-rows:44px 44px;gap:5px;justify-content:center}
.dpad button{font-size:21px;margin:0;padding:5px}
.up{grid-column:2}.left{grid-column:1;grid-row:2}
.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
</style>
</head>
<body>

<h1>🐍 ADITYA SNAKE PRO</h1>
<p>🍎 5 Fruits • 🌈 Colors • 🪙 Coins • ⚡ Power-ups</p>

<div class="panel">
 <div class="stat">🏆 स्कोर<br><b id="score">0</b></div>
 <div class="stat">⭐ रिकॉर्ड<br><b id="best">0</b></div>
 <div class="stat">🎯 लेवल<br><b id="level">1</b></div>
 <div class="stat">🪙 सिक्के<br><b id="coins">0</b></div>
 <div class="stat">❤️ जान<br><b id="lives">3</b></div>
</div>

<canvas id="game" width="420" height="420"></canvas>

<div class="controls">
 <button onclick="start()">▶ नया गेम</button>
 <button onclick="pause()">⏸ रोकें / चलाएँ</button>
 <button onclick="toggleSound()" id="soundBtn">🔊 साउंड ON</button>
</div>

<div class="controls">
 <label>🎨 थीम
 <select id="theme" onchange="draw()">
  <option value="rainbow">🌈 Rainbow</option>
  <option value="green">💚 Jungle</option>
  <option value="blue">💙 Ocean</option>
  <option value="pink">💗 Candy</option>
  <option value="gold">💛 Gold</option>
 </select>
 </label>
 <button onclick="buyLife()">❤️ 30 सिक्कों में जान</button>
</div>

<div class="dpad">
 <button class="up" onclick="turn(0,-1)">⬆️</button>
 <button class="left" onclick="turn(-1,0)">⬅️</button>
 <button class="down" onclick="turn(0,1)">⬇️</button>
 <button class="right" onclick="turn(1,0)">➡️</button>
</div>

<p id="msg">नया गेम दबाओ और खेल शुरू करो!</p>
<p>कीबोर्ड: Arrow Keys / WASD • Space: Pause</p>
<p>🍎 फल = 10 अंक | 🪙 सिक्का = 5 अंक | ⚡ बिजली = बोनस</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const N = 21, S = 20;

const fruits = [
 "🍎","🍌","🍊","🍇","🍓",
 "🍉","🍍","🥝","🍒","🥭",
 "🍐","🫐","🍑","🍋","🍈","🥥"
];

const themes = {
 green:"#39ff70",
 blue:"#38dfff",
 pink:"#ff54d9",
 gold:"#ffda55"
};

let snake = [];
let foods = [];
let coin = null;
let power = null;
let dx = 1, dy = 0;
let score = 0, level = 1, lives = 3;
let running = false, paused = false, ended = true;
let timer = null, sound = true, audio = null;
let shield = 0;

let coins = Number(localStorage.getItem("adityaCoins") || 0);
let best = Number(localStorage.getItem("adityaBest") || 0);

const $ = id => document.getElementById(id);

function stats(){
 $("score").textContent = score;
 $("level").textContent = level;
 $("lives").textContent = lives;
 $("coins").textContent = coins;
 $("best").textContent = best;
}

function randomCell(){
 return {
  x:Math.floor(Math.random()*N),
  y:Math.floor(Math.random()*N)
 };
}

function freeCell(){
 let p, tries = 0;
 do {
  p = randomCell();
  tries++;
  if(tries > 1000) return null;
 } while (
  snake.some(s=>s.x===p.x&&s.y===p.y) ||
  foods.some(f=>f.x===p.x&&f.y===p.y) ||
  (coin&&coin.x===p.x&&coin.y===p.y) ||
  (power&&power.x===p.x&&power.y===p.y)
 );
 return p;
}

// गेम में हमेशा 5 फल रखने की कोशिश
function newFood(){
 if(foods.length >= 5) return;
 const p = freeCell();
 if(!p) return;

 foods.push({
  ...p,
  emoji:fruits[Math.floor(Math.random()*fruits.length)]
 });
}

function fillFoods(){
 while(foods.length < 5) newFood();
}

function newCoin(){
 const p = freeCell();
 coin = p ? {...p,emoji:"🪙"} : null;
}

function newPower(){
 const p = freeCell();
 if(p) power = {...p,emoji:"⚡"};
}

function start(){
 clearInterval(timer);

 snake = [
  {x:10,y:10},
  {x:9,y:10},
  {x:8,y:10}
 ];

 foods = [];
 coin = null;
 power = null;

 dx = 1; dy = 0;
 score = 0; level = 1; lives = 3;
 shield = 0;
 running = true; paused = false; ended = false;

 fillFoods();
 newCoin();

 stats();
 $("msg").textContent = "🍎 एक साथ 5 फल खाओ और स्कोर बढ़ाओ!";
 schedule();
 draw();
}

function schedule(){
 clearInterval(timer);
 if(running){
  timer = setInterval(step,Math.max(55,140-(level-1)*9));
 }
}

function pause(){
 if(ended) return;

 if(running){
  running = false;
  paused = true;
  clearInterval(timer);
  $("msg").textContent = "गेम रुक गया है ⏸";
 }else if(paused){
  paused = false;
  running = true;
  $("msg").textContent = "फिर से खेलो! 🎮";
  schedule();
 }
 draw();
}

function turn(x,y){
 if(!running || (x===-dx&&y===-dy)) return;
 dx=x; dy=y;
}

document.addEventListener("keydown",e=>{
 const keys={
  ArrowUp:[0,-1],w:[0,-1],
  ArrowDown:[0,1],s:[0,1],
  ArrowLeft:[-1,0],a:[-1,0],
  ArrowRight:[1,0],d:[1,0]
 };

 const k=e.key.length===1 ? e.key.toLowerCase() : e.key;

 if(keys[k]){
  e.preventDefault();
  turn(...keys[k]);
 }

 if(e.code==="Space"){
  e.preventDefault();
  pause();
 }
});

function beep(freq=600){
 if(!sound) return;

 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();

  if(audio.state==="suspended") audio.resume();

  const o=audio.createOscillator();
  const g=audio.createGain();

  o.connect(g);
  g.connect(audio.destination);
  o.frequency.value=freq;
  g.gain.value=.06;
  o.start();
  o.stop(audio.currentTime+.12);
 }catch(e){}
}

function toggleSound(){
 sound=!sound;
 $("soundBtn").textContent=sound?"🔊 साउंड ON":"🔇 साउंड OFF";
 if(sound) beep();
}

function save(){
 localStorage.setItem("adityaCoins",coins);
 localStorage.setItem("adityaBest",best);
}

function buyLife(){
 if(coins<30){
  $("msg").textContent="और 30 सिक्के जमा करो! 🪙";
  return;
 }
 if(lives>=5){
  $("msg").textContent="तुम्हारे पास पहले से 5 जान हैं! ❤️";
  return;
 }

 coins-=30;
 lives++;
 save();
 stats();
 beep(800);
 $("msg").textContent="एक अतिरिक्त जान मिल गई! ❤️";
}

function step(){
 if(!running) return;

 const h={x:snake[0].x+dx,y:snake[0].y+dy};

 const fruitIndex=foods.findIndex(
  f=>f.x===h.x&&f.y===h.y
 );

 const eating=fruitIndex!==-1;
 const takingCoin=coin&&h.x===coin.x&&h.y===coin.y;
 const takingPower=power&&h.x===power.x&&h.y===power.y;

 const body=(eating||takingCoin||takingPower)
  ? snake : snake.slice(0,-1);

 const hit=
  h.x<0||h.x>=N||h.y<0||h.y>=N||
  body.some(p=>p.x===h.x&&p.y===h.y);

 if(hit){
  if(shield>0){
   shield--;
   snake=[
    {x:10,y:10},{x:9,y:10},{x:8,y:10}
   ];
   dx=1;dy=0;
   $("msg").textContent="⚡ शील्ड ने बचा लिया!";
   beep(350);
   draw();
   return;
  }

  lives--;
  stats();
  beep(180);

  if(lives<=0){
   finish();
   return;
  }

  snake=[
   {x:10,y:10},{x:9,y:10},{x:8,y:10}
  ];
  dx=1;dy=0;

  $("msg").textContent="एक जान चली गई! ❤️";
  draw();
  return;
 }

 snake.unshift(h);

 if(eating){
  foods.splice(fruitIndex,1);
  score+=10;
  beep(750);

  // खाए गए फल की जगह नया फल
  fillFoods();

  if(score>=level*100){
   level++;
   $("msg").textContent="🎉 नया लेवल! स्पीड बढ़ गई!";
   beep(1000);
  }

  if(Math.random()<.3 && !power) newPower();

 }else if(takingCoin){
  score+=5;
  coins++;
  newCoin();
  beep(950);
  $("msg").textContent="🪙 सिक्का मिल गया!";
 }else if(takingPower){
  shield=1;
  score+=20;
  power=null;
  beep(1100);
  $("msg").textContent="⚡ शील्ड तैयार! अगली टक्कर से बचाव";
 }else{
  snake.pop();
 }

 if(score>best) best=score;

 stats();
 save();
 schedule();
 draw();
}

function finish(){
 running=false;
 paused=false;
 ended=true;
 clearInterval(timer);
 draw();

 ctx.fillStyle="#000c";
 ctx.fillRect(35,150,350,120);

 ctx.textAlign="center";
 ctx.fillStyle="#ff718f";
 ctx.font="bold 28px Arial";
 ctx.fillText("GAME OVER!",210,194);

 ctx.fillStyle="white";
 ctx.font="18px Arial";
 ctx.fillText("स्कोर: "+score+" | लेवल: "+level,210,228);

 $("msg").textContent="फिर से खेलने के लिए नया गेम दबाओ!";
}

function draw(){
 const theme=$("theme").value;

 const bg={
  rainbow:"#071520",
  green:"#10251b",
  blue:"#10102b",
  pink:"#281126",
  gold:"#25200b"
 };

 ctx.fillStyle=bg[theme]||"#071520";
 ctx.fillRect(0,0,420,420);

 ctx.strokeStyle="#ffffff0d";

 for(let i=0;i<=N;i++){
  ctx.beginPath();
  ctx.moveTo(i*S,0);
  ctx.lineTo(i*S,420);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0,i*S);
  ctx.lineTo(420,i*S);
  ctx.stroke();
 }

 function emoji(p,size=25){
  if(!p) return;
  ctx.font=size+"px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(p.emoji,p.x*S+10,p.y*S+10);
 }

 // सभी 5 फल दिखाओ
 foods.forEach(f=>emoji(f,25));

 emoji(coin,23);
 emoji(power,24);

 snake.forEach((p,i)=>{
  const col=theme;

  ctx.fillStyle=col==="rainbow"
   ? `hsl(${(i*15+score*4)%360},100%,60%)`
   : themes[col];

  ctx.shadowColor=ctx.fillStyle;
  ctx.shadowBlur=i===0?14:5;

  ctx.beginPath();
  ctx.roundRect(p.x*S+2,p.y*S+2,16,16,5);
  ctx.fill();

  ctx.shadowBlur=0;

  if(i===0){
   ctx.fillStyle="#101525";

   ctx.beginPath();
   ctx.arc(p.x*S+7,p.y*S+7,2,0,Math.PI*2);
   ctx.fill();

   ctx.beginPath();
   ctx.arc(p.x*S+13,p.y*S+7,2,0,Math.PI*2);
   ctx.fill();

   if(shield){
    ctx.strokeStyle="#fff";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(p.x*S+10,p.y*S+10,12,0,Math.PI*2);
    ctx.stroke();
   }
  }
 });

 if(paused){
  ctx.fillStyle="#000a";
  ctx.fillRect(60,170,300,70);
  ctx.fillStyle="white";
  ctx.font="bold 26px Arial";
  ctx.textAlign="center";
  ctx.fillText("PAUSED",210,213);
 }
}

draw();
stats();
</script>
</body>
</html>
